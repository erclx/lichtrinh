# Pull request domain labels.
#
# `git-pr` matches the paths a branch changed against the prefixes below and
# applies every label that matches. The rows here cover what the toolkit
# installs. Add a row per surface of your own, such as `app = ["src/"]`, and
# `canon labels audit` names any changed path no row reaches.
#
# Each label has to exist on the remote before a pull request can carry it.
# Run `canon labels sync` once to create the ones the remote lacks, and again
# after adding a row.
#
# `canon labels sync` colors each label it creates from a fixed palette in row
# order. A row may take the table form to choose its own color, such as
# `app = { paths = ["src/"], color = "1f6feb" }`, and `canon labels sync
# --check` reports a declared color the remote holds differently without
# editing it.
#
# The matching rule and the `[declined]` table are described in the `git-pr`
# skill's labels reference.

[domains]
tooling = { color = "8c959f", paths = [
  ".github/",
  ".husky/",
  "scripts/",
  ".gitignore",
  ".lintstagedrc",
  ".oxfmtrc.json",
  ".prettierignore",
  "commitlint.config.js",
  "package.json",
  "bun.lock",
  "canon/config/",
  ".oxlintrc.json",
  "tsconfig.json",
  "tsconfig.app.json",
  "tsconfig.node.json",
  "vite.config.ts",
  "vitest.config.ts",
  "playwright.config.ts",
  "release-please-config.json",
] }
claude = { paths = [".claude/", "CLAUDE.md"], color = "d2a8ff" }
docs = { color = "0075ca", paths = [
  "README.md",
  "docs/",
  "canon/REQUIREMENTS.md",
  "canon/DESIGN.md",
  "canon/context/",
  "CONTRIBUTING.md",
  "SECURITY.md",
] }
app = { paths = ["web/", "index.html", "components.json"], color = "1f6feb" }
api = { paths = [
  "worker/",
  "wrangler.jsonc",
  "drizzle.config.ts",
], color = "2da44e" }
shared = { paths = ["shared/"], color = "56d364" }
e2e = { paths = ["e2e/"], color = "d29922" }
voice = { paths = ["voice/"], color = "bf8700" }
bridge = { paths = ["bridge/"], color = "0598bc" }
design = { paths = ["canon/design/"], color = "a371f7" }
cli = { paths = ["cli/"], color = "6e7781" }

# Paths deliberately left unlabelled, keyed by the reason.
[declined]
# Release automation opens its own pull request and applies its own label.
release-managed = ["CHANGELOG.md", ".release-please-manifest.json"]
# Generated evidence screenshots are captured output, not source.
generated = ["e2e/evidence/readme/"]
# Licence text is legal boilerplate with no surface to label.
licence-text = ["LICENSE"]
