# Pull request domain labels.
#
# `git-pr` matches the paths a branch changed against the prefixes below and
# applies every label that matches. The rows here cover what the toolkit
# installs. Add a row per surface of your own, such as `app = ["src/"]`, and
# `canon labels audit` names any changed path no row reaches.
#
# Each label has to exist on the remote before a pull request can carry it.
# Run `canon labels sync` once to create the ones the remote lacks, and again
# after adding a row.
#
# The matching rule and the `[declined]` table are described in the `git-pr`
# skill's labels reference.

[domains]
tooling = [
  ".github/",
  ".husky/",
  "scripts/",
  ".gitignore",
  ".lintstagedrc",
  ".oxfmtrc.json",
  ".prettierignore",
  "commitlint.config.js",
  "package.json",
  "bun.lock",
  "canon/config/",
  ".oxlintrc.json",
  "tsconfig.json",
  "tsconfig.app.json",
  "tsconfig.node.json",
  "vite.config.ts",
  "vitest.config.ts",
  "playwright.config.ts",
  "release-please-config.json",
]
claude = [".claude/", "CLAUDE.md"]
docs = [
  "README.md",
  "docs/",
  "canon/REQUIREMENTS.md",
  "canon/DESIGN.md",
  "canon/context/",
  "CONTRIBUTING.md",
  "SECURITY.md",
]
app = ["src/", "index.html", "public/", "components.json"]
api = ["worker/", "wrangler.jsonc", "drizzle.config.ts"]
shared = ["shared/"]
e2e = ["e2e/"]
voice = ["voice/"]
bridge = ["bridge/"]
design = ["canon/design/"]
cli = ["cli/"]

# Paths deliberately left unlabelled, keyed by the reason.
[declined]
# Release automation opens its own pull request and applies its own label.
release-managed = ["CHANGELOG.md", ".release-please-manifest.json"]
# Generated evidence screenshots are captured output, not source.
generated = ["assets/evidence/"]
# Licence text is legal boilerplate with no surface to label.
licence-text = ["LICENSE"]
