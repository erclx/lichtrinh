<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../assets/screens/fonts/fonts.css" />
    <link rel="stylesheet" href="../assets/screens/fonts/fonts-cute.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html[data-lang='en'] .vi,
      html[data-lang='vi'] .en {
        display: none;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--body), sans-serif;
        font-size: 21px;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
      }
      .label {
        margin: 16px;
        padding: 12px 14px;
        border: 2px dashed var(--line);
        border-radius: 10px;
        font:
          14px/1.5 Inter,
          sans-serif;
        color: var(--muted);
        background: var(--bg);
        position: relative;
        z-index: 2;
      }
      .label b {
        color: var(--text);
        font-size: 16px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        position: relative;
      }
      .brand {
        font-family: var(--disp), sans-serif;
        font-weight: 800;
        font-size: 22px;
      }
      .seg {
        display: flex;
        border-radius: 999px;
        padding: 4px;
        background: var(--fill);
      }
      .seg button {
        font: inherit;
        font-family: var(--body), sans-serif;
        font-size: 18px;
        font-weight: 800;
        border: 0;
        background: transparent;
        color: var(--muted);
        min-width: 60px;
        height: 56px;
        border-radius: 999px;
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: var(--selBg);
        color: var(--selFg);
      }
      .head {
        padding: 4px 16px 12px;
        position: relative;
      }
      .kick {
        font-size: 18px;
        font-weight: 700;
        color: var(--muted);
      }
      .h-title {
        font-family: var(--disp), sans-serif;
        font-weight: 800;
        font-size: 34px;
        line-height: 1.15;
      }
      .meta {
        font-size: 18px;
        color: var(--muted);
        margin-top: 4px;
      }
      .meta b {
        color: var(--text);
      }
      .wk {
        display: flex;
        gap: 8px;
        padding: 6px 16px 14px;
        overflow: hidden;
        position: relative;
      }
      .wd {
        flex: none;
        width: 58px;
        height: 76px;
        border-radius: var(--chipR);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--chip);
        font-size: 15px;
        font-weight: 700;
        color: var(--muted);
      }
      .wd b {
        font-size: 22px;
        color: var(--text);
        font-weight: 800;
      }
      .wd.on {
        background: var(--selBg);
        color: var(--selFg);
      }
      .wd.on b {
        color: var(--selFg);
      }
      .day {
        list-style: none;
        padding: 4px 16px;
      }
      .e {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 12px;
        padding: 12px 0;
        align-items: start;
      }
      .e .t {
        font-weight: 800;
        font-size: 22px;
        line-height: 1.2;
      }
      .e .t small {
        display: block;
        font-weight: 600;
        font-size: 18px;
        color: var(--muted);
        margin-top: 2px;
      }
      .e .n {
        font-weight: 700;
        font-size: 22px;
        line-height: 1.3;
      }
      .e .m {
        font-size: 18px;
        color: var(--muted);
        margin-top: 2px;
      }
      .e .k {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 2px;
      }
      .e.done .n {
        font-size: 18px;
        color: var(--muted);
        font-weight: 600;
      }
      .e.now .n {
        font-size: 27px;
        font-family: var(--disp), sans-serif;
        font-weight: 800;
      }
      .i {
        width: 28px;
        height: 28px;
      }
      .ic {
        display: none;
      }
      .ck {
        display: none;
      }
      .food {
        --c: var(--food);
        --ci: var(--foodI);
      }
      .sights {
        --c: var(--sights);
        --ci: var(--sightsI);
      }
      .rest {
        --c: var(--rest);
        --ci: var(--restI);
      }
      .transit {
        --c: var(--transit);
        --ci: var(--transitI);
      }
      .act {
        --c: var(--act);
        --ci: var(--actI);
      }
      .acts {
        padding: 12px 16px;
      }
      .add {
        height: 64px;
        border-radius: var(--btnR);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 800;
        border: 2.5px dashed var(--line);
        color: var(--text);
      }
      .talkbar {
        padding: 10px 16px 14px;
      }
      .talk {
        height: 72px;
        border-radius: var(--btnR);
        background: var(--action);
        color: var(--onAction);
        font-size: 22px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .tabs {
        display: flex;
        padding: 8px 12px 14px;
        gap: 8px;
        background: var(--bg);
      }
      .tabs div {
        flex: 1;
        height: 76px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        font-weight: 800;
        color: var(--muted);
        gap: 4px;
        border-radius: 22px;
      }
      .tabs svg {
        width: 28px;
        height: 28px;
      }
      .tabs .on {
        color: var(--selFg);
        background: var(--selBg);
      }
      .desk {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 380px;
        min-height: 900px;
      }
      .nav {
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ni {
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        border-radius: 22px;
        font-size: 21px;
        font-weight: 800;
        color: var(--muted);
      }
      .ni svg {
        width: 26px;
        height: 26px;
      }
      .ni.on {
        color: var(--selFg);
        background: var(--selBg);
      }
      .mid {
        min-width: 0;
      }
      .midin {
        max-width: 760px;
        margin: 0 auto;
        padding-top: 8px;
      }
      .side {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .side h3 {
        font-family: var(--disp), sans-serif;
        font-size: 24px;
        font-weight: 800;
      }
      .fpo {
        flex: 1;
        border: 2.5px dashed var(--line);
        border-radius: 24px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 16px;
        padding: 16px;
      }
    </style>
    <style>
      :root {
        --disp: 'Nunito';
        --body: 'Nunito';
        --bg: #f8f8fc;
        --surface: #ffffff;
        --fill: #ececf6;
        --chip: #ffffff;
        --line: #dcdcea;
        --text: #1f1d33;
        --muted: #5c5a75;
        --action: #1f1d33;
        --onAction: #ffffff;
        --selBg: #1f1d33;
        --selFg: #ffffff;
        --btnR: 24px;
        --chipR: 18px;
        --cloud: #e9e4ff;
        --food: #ffd9bf;
        --foodI: #7a3b12;
        --sights: #ffcfe1;
        --sightsI: #8a1f4f;
        --rest: #dcd8ff;
        --restI: #3e338f;
        --transit: #cfe8ff;
        --transitI: #134c7a;
        --act: #c9f1dd;
        --actI: #145a3a;
      }
      :root[data-theme='dark'] {
        --bg: #121220;
        --surface: #1b1b2c;
        --fill: #26263b;
        --chip: #1f1f31;
        --line: #34344f;
        --text: #f1f0fb;
        --muted: #b0aecb;
        --action: #f1f0fb;
        --onAction: #121220;
        --selBg: #f1f0fb;
        --selFg: #121220;
        --cloud: #302a58;
        --food: #5b3a26;
        --foodI: #ffd2b3;
        --sights: #5a2c40;
        --sightsI: #ffc4da;
        --rest: #3a355e;
        --restI: #d6d1ff;
        --transit: #23415a;
        --transitI: #c4e2ff;
        --act: #22483a;
        --actI: #bff0d6;
      }
      .h-title {
        font-weight: 900;
      }
      .e {
        grid-template-columns: 52px 1fr 76px;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1.5px solid var(--line);
        align-items: center;
      }
      .ic {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--c);
        color: var(--ci);
      }
      .e .t {
        order: 3;
        text-align: right;
        font-size: 20px;
      }
      .e .t small {
        font-size: 17px;
      }
      .e.now {
        grid-template-columns: 1fr;
        background: var(--cloud);
        border-radius: 28px;
        padding: 20px;
        border: 0;
        margin: 8px 0;
      }
      .e.now .ic,
      .e.now .t {
        display: none;
      }
      .e.now .k {
        color: var(--action);
      }
      .bar {
        height: 10px;
        border-radius: 5px;
        background: color-mix(in srgb, var(--surface) 60%, transparent);
        margin-top: 12px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 50%;
        background: var(--action);
        border-radius: 5px;
      }
      .e.done .ic {
        opacity: 0.5;
        width: 40px;
        height: 40px;
      }
      .e.done {
        grid-template-columns: 40px 1fr 76px;
      }

      .e.now {
        background: var(--c);
      }
      .e.now .k {
        color: var(--ci);
      }
      .bar {
        background: color-mix(in srgb, var(--surface) 70%, transparent);
      }
      .bar i {
        background: var(--ci);
      }
    </style>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      #scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .tabs {
        flex: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        text-align: inherit;
      }
      .seg button {
        text-align: center;
      }
      .wd {
        cursor: pointer;
        position: relative;
      }
      .wd.today:after {
        content: '';
        position: absolute;
        bottom: 6px;
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: currentColor;
      }
      .e {
        cursor: pointer;
      }
      .empty {
        margin: 12px 16px;
        padding: 22px;
        border: 2.5px dashed var(--line);
        border-radius: 22px;
        text-align: center;
        color: var(--muted);
        font-size: 19px;
      }
      .back {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px 0;
      }
      .round {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--fill);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 800;
      }
      .trip {
        display: block;
        width: calc(100% - 32px);
        margin: 10px 16px;
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 24px;
        padding: 18px;
      }
      .trip .tn {
        font-size: 22px;
        font-weight: 800;
      }
      .trip .td {
        font-size: 18px;
        color: var(--muted);
        margin-top: 2px;
      }
      .trip .tr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        font-size: 18px;
      }
      .pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 800;
        background: var(--c, var(--fill));
        color: var(--ci, var(--text));
      }
      .sec {
        font-size: 20px;
        font-weight: 800;
        padding: 16px 16px 0;
      }
      .sw {
        display: flex;
        margin: 8px 16px;
        background: var(--fill);
        border-radius: 999px;
        padding: 4px;
      }
      .sw button {
        flex: 1;
        height: 56px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: 800;
        color: var(--muted);
        text-align: center;
      }
      .sw button.on {
        background: var(--selBg);
        color: var(--selFg);
      }
      .chips {
        display: flex;
        gap: 8px;
        padding: 6px 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chip {
        flex: none;
        height: 52px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--fill);
        font-size: 18px;
        font-weight: 800;
        white-space: nowrap;
      }
      .chip.on {
        background: var(--selBg);
        color: var(--selFg);
      }
      .mon {
        margin: 8px 16px;
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 24px;
        padding: 10px;
      }
      .mh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 4px 8px;
      }
      .mh b {
        font-size: 21px;
      }
      .mh button {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--fill);
        font-size: 22px;
        font-weight: 800;
        text-align: center;
      }
      .dow,
      .mg {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
        text-align: center;
      }
      .dow {
        font-size: 14px;
        color: var(--muted);
        font-weight: 800;
        padding-bottom: 4px;
      }
      .mg button {
        height: 52px;
        border-radius: 14px;
        font-size: 18px;
        font-weight: 800;
        text-align: center;
        position: relative;
        background: var(--tc, transparent);
        color: var(--ti, var(--text));
      }
      .mg button.o {
        color: var(--line);
        background: transparent;
      }
      .mg button.td {
        outline: 3px solid var(--text);
        outline-offset: -3px;
      }
      .mg button.sel {
        background: var(--selBg);
        color: var(--selFg);
      }
      .mg i {
        position: absolute;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: currentColor;
      }
      .leg {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 8px 4px 2px;
        font-size: 15px;
        color: var(--muted);
      }
      .leg span:before {
        content: '';
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: var(--tc);
        margin-right: 6px;
        vertical-align: -2px;
      }
      .wkrow {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 6px 16px;
        padding: 12px 14px;
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 20px;
        width: calc(100% - 32px);
        min-height: 64px;
      }
      .wkrow .dd {
        width: 64px;
        flex: none;
        font-weight: 800;
        line-height: 1.15;
      }
      .wkrow .dd small {
        display: block;
        font-size: 15px;
        color: var(--muted);
        font-weight: 700;
      }
      .wkrow .ds {
        flex: 1;
        font-size: 17px;
        color: var(--muted);
      }
      .dots {
        display: flex;
        gap: 4px;
      }
      .dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--c);
      }
      .sheet-bg {
        position: absolute;
        inset: 0;
        background: rgba(20, 18, 35, 0.42);
        display: flex;
        align-items: flex-end;
        z-index: 20;
      }
      .sheet {
        width: 100%;
        max-height: 92%;
        overflow-y: auto;
        background: var(--bg);
        border-radius: 28px 28px 0 0;
        padding: 10px 16px 20px;
      }
      .grab {
        width: 48px;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        margin: 4px auto 10px;
      }
      .sheet h2 {
        font-size: 27px;
        font-weight: 900;
        margin-bottom: 8px;
      }
      .fl {
        font-size: 18px;
        font-weight: 800;
        margin: 14px 0 6px;
      }
      .in {
        width: 100%;
        height: 64px;
        border-radius: 18px;
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 21px;
        padding: 0 16px;
      }
      .cats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .cats button {
        height: 72px;
        border-radius: 18px;
        background: var(--c);
        color: var(--ci);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        border: 3px solid transparent;
        text-align: center;
      }
      .cats button.on {
        border-color: var(--text);
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .btns {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .btn {
        flex: 1;
        height: 64px;
        border-radius: 22px;
        font-size: 21px;
        font-weight: 800;
        text-align: center;
        background: var(--fill);
      }
      .btn.pri {
        background: var(--action);
        color: var(--onAction);
      }
      .toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 186px;
        z-index: 30;
        background: var(--text);
        color: var(--bg);
        border-radius: 20px;
        padding: 12px 12px 12px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 700;
        box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.5);
      }
      .toast span.msg {
        flex: 1;
      }
      .toast button {
        height: 52px;
        padding: 0 16px;
        border-radius: 14px;
        background: var(--bg);
        color: var(--text);
        font-weight: 800;
      }
      .bub {
        max-width: 88%;
        padding: 12px 16px;
        border-radius: 20px;
        margin: 8px 0;
        font-size: 19px;
      }
      .bub.me {
        margin-left: auto;
        background: var(--selBg);
        color: var(--selFg);
        border-bottom-right-radius: 6px;
      }
      .bub.ai {
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-bottom-left-radius: 6px;
      }
      .chg {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--fill);
        font-size: 17px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chg b {
        flex: 1;
      }
      .chg button {
        height: 48px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--action);
        color: var(--onAction);
        font-weight: 800;
      }
      .say {
        display: block;
        width: 100%;
        min-height: 64px;
        margin: 8px 0;
        padding: 12px 16px;
        border-radius: 20px;
        border: 2px solid var(--line);
        background: var(--surface);
        font-size: 19px;
        font-weight: 700;
      }
      .mic-big {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--action);
        color: var(--onAction);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 6px auto 4px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .mic-big {
          animation: pulse 1.6s ease-out infinite;
        }
        @keyframes pulse {
          0% {
            box-shadow: 0 0 0 0
              color-mix(in srgb, var(--action) 45%, transparent);
          }
          100% {
            box-shadow: 0 0 0 22px transparent;
          }
        }
      }
      .hint {
        text-align: center;
        color: var(--muted);
        font-size: 17px;
      }

      .dots3 {
        display: inline-flex;
        gap: 6px;
        vertical-align: middle;
        margin-right: 8px;
      }
      .dots3 i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      .steps2 {
        display: flex;

              yy--
            }
            if (mm > 12) {
              mm = 1
              yy++
            }
            S.calMonth = yy + '-' + ('0' + mm).slice(-2)
            keep = true
          } else if (a === 'wprev' || a === 'wnext') {
            S.calDay = add(S.calDay, a === 'wnext' ? 7 : -7)
            keep = true
          } else if (a === 'dprev' || a === 'dnext') {
            S.calDay = add(S.calDay, a === 'dnext' ? 1 : -1)
          } else if (a === 'add') {
            if (S.noNet) {
              flash(
                T('Cần có mạng để sửa lịch.', 'Editing needs a connection.'),
              )
              render()
              return
            }
            var d = S.tab === 'c' ? S.calDay : S.sel
            if (S.tab === 'p' && S.trip) {
              var r3 = TRIPS.filter(function (x) {
                return x.id === S.trip
              })[0]
              d = S.sel >= r3.s && S.sel <= r3.e ? S.sel : r3.s
            }
            S.form = { d: d, title: '', cat: 'food', s: 900, len: 60, cost: 0 }
            S.sheet = 'add'
          } else if (a === 'fcat') {
            readForm()
            S.form.cat = el.dataset.c
          } else if (a === 'save') {
            readForm()
            var f = S.form
            if (!f.title.trim()) {
              var i = document.getElementById('ft')
              i.focus()
              i.style.borderColor = 'var(--text)'
              i.placeholder =
                document.documentElement.lang === 'vi'
                  ? 'Cần có tên hoạt động'
                  : 'Give it a name first'
              return
            }
            var tr = tripOf(f.d) || { id: 'pt' },
              c
            if (f.eid) {
              var ex = ENT.filter(function (e) {
                return e.id === f.eid
              })[0]
              c = editE(
                ex,
                {
                  vi: f.title,
                  en: f.title,
                  cat: f.cat,
                  s: f.s,
                  e: f.s + f.len,
                  cost: f.cost,
                },
                'me',
              )
              S.sheet = null
              flash(
                T('Đã lưu “', 'Saved “') + f.title.replace(/</g, '&lt;') + '”.',
                c,
              )
            } else {
              c = addE(
                {
                  id: uid++,
                  trip: tr.id,
                  d: f.d,
                  s: f.s,
                  e: f.s + f.len,
                  vi: f.title,
                  en: f.title,
                  cat: f.cat,
                  cost: f.cost,
                },
                'me',
              )
              S.sheet = null
              flash(
                T('Đã thêm “', 'Added “') +
                  f.title.replace(/</g, '&lt;') +
                  T('” lúc ', '” at ') +
                  t(f.s) +
                  '.',
                c,
              )
            }
          } else if (a === 'talk') {
            S.dock = true
            if (innerWidth >= 700) S.panel = true
            else S.sheet = 'talk'
          } else if (a === 'navtog') {
            S.navOff = !S.navOff
          } else if (a === 'panel') {
            if (innerWidth >= 1100) S.dock = S.dock === false
            else S.panel = !S.panel
          } else if (a === 'send') {
            S.talk = null
            var inp =
              [...document.querySelectorAll('#ci')].find(function (x) {
                return x.offsetParent
              }) || document.getElementById('ci')
            var v = ((inp && inp.value) || '').trim()
            if (!v || busy) return
            S.draft = ''
            var l = v.toLowerCase()
            var k = /c(à|a) ph(ê|e)|coffee/.test(l)
              ? 'addcoffee'
              : /t(ố|o)i|dinner/.test(l)
                ? 'movedinner'
                : /xe|taxi/.test(l)
                  ? 'rmtaxi'
                  : /bao nhi(ê|e)u|how much|cost/.test(l)
                    ? 'ask'
                    : null
            if (k) {
              act(k, v)
              return
            }
            S.chat.push({ who: 'me', html: v.replace(/</g, '&lt;') })
            S.chat.push({
              who: 'ai',
              html: T(
                'Bản thử chỉ làm được vài việc: thêm cà phê, dời bữa tối, bỏ gọi xe, hoặc hỏi chi phí hôm nay.',
                'This prototype can only do a few things: add a coffee, move dinner, remove the taxi, or tell you today’s cost.',
              ),
            })
          } else if (a === 'toastx') {
            S.toast = null
            undo = null
            clearTimeout(tt)
          } else if (a === 'stop') {
            if (cur) {
              cur.timers.forEach(clearTimeout)
              if (cur.iv) clearInterval(cur.iv)
              if (cur.cid) undoC(cur.cid)
              cur.m.st = null
              cur.m.html = T(
                'Đã dừng. Lịch chưa thay đổi gì.',
                'Stopped. Nothing in the plan changed.',
              )
              busy = false
              cur = null
            }
          } else if (a === 'say') {
            act(el.dataset.k)
          } else if (a === 'undo') {
            var cc = el.dataset.c ? +el.dataset.c : undo
            if (cc) {
              if (typeof cc === 'number') undoC(cc)
              else restore(cc)
              undo = null
              S.toast = T('Đã hoàn tác.', 'Undone.')
              S.chat.push({
                who: 'ai',
                html: T('Đã hoàn tác thay đổi.', 'I undid that change.'),
              })
              clearTimeout(tt)
              tt = setTimeout(function () {
                S.toast = null
                render()
              }, 3000)
            }
          } else if (a === 'screen') {
            S.screen = el.dataset.v
            if (S.screen === 'chats' && innerWidth < 700) S.sheet = null
          } else if (a === 'sback') {
            var PAR = {
              acreate: 'admin',
              apw: 'admin',
              av: 'settings',
              admin: 'settings',
              install: 'settings',
            }
            S.screen = PAR[S.screen] || null
          } else if (a === 'theme') {
            S.theme = el.dataset.v
          } else if (a === 'tog') {
            S[el.dataset.v] = !S[el.dataset.v]
            if (el.dataset.v === 'cold') S.coldV = S.cold
            if (el.dataset.v === 'offline') {
              S.talk = null
              S.notified = null
            }
          } else if (a === 'tut') {
            S.screen = null
            S.tab = 't'
            S.tut = 1
          } else if (a === 'tutn') {
            S.tut = S.tut < 3 ? S.tut + 1 : 0
          } else if (a === 'tutx') {
            S.tut = 0
          } else if (a === 'practice') {
            S.screen = null
            S.tab = 'p'
            S.trip = 'pt'
            S.sel = '2031-05-01'
          } else if (a === 'signout') {
            S.signed = false
            S.screen = null
            S.fails = 0
          } else if (a === 'signin') {
            var pw = (document.getElementById('sp') || {}).value || ''
            if (pw === 'demo') {
              S.signed = true
              S.fails = 0
            } else {
              S.fails++
              if (S.fails >= 10) S.locked = true
            }
          } else if (a === 'unlock') {
            S.locked = false
            S.fails = 0
          } else if (a === 'ntcreate') {
            var nm = (document.getElementById('ntn').value || '').trim()
            if (!nm) {
              document.getElementById('ntn').focus()
              return
            }
            var f1 = document.getElementById('ntf').value,
              f2 = document.getElementById('ntt').value
            if (f2 < f1) f2 = f1
            var id = 't' + uid++
            TRIPS.unshift({
              id: id,
              vi: nm,
              en: nm,
              s: f1,
              e: f2,
              c: ['act', 'transit', 'food', 'rest', 'sights'][TRIPS.length % 5],
            })
            S.screen = null
            S.tab = 'p'
            S.trip = id
            S.sel = f1
            flash(T('Đã tạo “', 'Created “') + nm.replace(/</g, '&lt;') + '”.')
          } else if (a === 'entry') {
            S.eid = +el.dataset.id
            S.screen = 'entry'
          } else if (a === 'eedit') {
            if (S.noNet) {
              flash(
                T('Cần có mạng để sửa lịch.', 'Editing needs a connection.'),
              )
              render()
              return
            }
            var x = ENT.filter(function (e) {
              return e.id === S.eid
            })[0]
            S.form = {
              eid: x.id,
              d: x.d,
              title: L2(x),
              cat: x.cat,
              s: x.s,
              len: x.e - x.s,
              cost: x.cost,
            }
            S.sheet = 'add'
          } else if (a === 'edel') {
            S.sheet = 'del'
          } else if (a === 'edelok') {
            var x2 = ENT.filter(function (e) {
              return e.id === S.eid
            })[0]
            var c2 = delE(x2, 'me')
            S.sheet = null
            S.screen = null
            flash(T('Đã xoá “', 'Deleted “') + x2.vi + '”.', c2)
          } else if (a === 'mic') {
            if (innerWidth < 700 && S.sheet !== 'talk') S.sheet = 'talk'
            if (S.talk === 'warm') return
            if (S.talk === 'transcribing') return
            if (S.talk === 'listen') {
              S.talk = 'transcribing'
              setTimeout(function () {
                if (S.talk === 'transcribing') {
                  S.talk = 'review'
                  S.draft = 'doi an toi sang 8 gio'
                  render()
                }
              }, 1500)
            } else if (S.coldV) {
              S.talk = 'warm'
              S.coldV = false
              setTimeout(function () {
                if (S.talk === 'warm') {
                  S.talk = 'listen'
                  render()
                }
              }, 1200)
            } else S.talk = 'listen'
          } else if (a === 'trsend') {
            var tv = (document.getElementById('tr') || {}).value || S.transcript
            S.talk = null
            S.draft = tv
            render()
            var sb = [...document.querySelectorAll('[data-a=send]')].find(
              function (x) {
                return x.offsetParent
              },
            )
            var ci = [...document.querySelectorAll('#ci')].find(function (x) {
              return x.offsetParent
            })
            if (ci) ci.value = tv
            if (sb) sb.click()
            return
          } else if (a === 'trcancel') {
            S.talk = null
          } else if (a === 'notify') {
            S.notified = t(NOW + 5)
            S.chat = S.chat.map(function (m) {
              return m.html && m.html.indexOf('offc') >= 0
                ? { who: 'ai', html: offCardHTML() }
                : m
            })
          } else if (a === 'reset') {
            var ac = ACC[+el.dataset.v]
            S.pw = genPw()
            S.pwFor = ac.n
            S.screen = 'apw'
          } else if (a === 'acsave') {
            var an =
              (document.getElementById('acn').value || '').trim() ||
              (document.documentElement.lang === 'vi' ? 'Cô Út' : 'Auntie')
            ACC.push({
              n: [an, an],
              u: an.toLowerCase().replace(/[^a-z]/g, '') || 'user',
              r: S.ar,
              chat: S.ac,
              c: 'rest',
              seen: ['Chưa vào', 'Never'],
            })
            S.pw = genPw()
            S.pwFor = [an, an]
            S.screen = 'apw'
          } else if (a === 'ar') {
            S.ar = el.dataset.v
          } else if (a === 'acchat') {
            S.ac = el.dataset.v === 'on'
          } else if (a === 'backup') {
            flash(
              T(
                'Đã tải bản sao lưu (bản thử).',
                'Backup downloaded (prototype).',
              ),
            )
          } else if (a === 'model') {
            var mv = el.dataset.v.split(':')
            S.models[mv[0]] = mv[1]
          } else if (a === 'openchat') {
            S.screen = null
            S.panel = true
            if (innerWidth < 700) S.sheet = 'talk'
          } else if (a === 'newchat') {
            S.chat = []
            S.chats.unshift({
              t: ['Cuộc trò chuyện mới', 'New chat'],
              w: t(NOW),
            })
            S.screen = null
            S.panel = true
            if (innerWidth < 700) S.sheet = 'talk'
          } else if (a === 'close') {
            S.sheet = null
          }
          render()
        })
        render()
      })()
    </script>
  </body>
</html>
