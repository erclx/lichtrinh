    <script>
      document.addEventListener('click', function (event) {
        var button = event.target.closest('button[lang]')
        if (!button) return
        document.documentElement.dataset.lang = button.lang
        document.documentElement.lang = button.lang
      })

      function settle() {
        document
          .querySelectorAll('[role=radio][aria-checked=true]')
          .forEach(function (chosen) {
            var box = chosen.closest('[role=radiogroup]')
            while (box && box.scrollHeight <= box.clientHeight + 1)
              box = box.parentElement
            if (
              box &&
              box !== document.documentElement &&
              box !== document.body
            )
              box.scrollTop = chosen.offsetTop - box.clientHeight / 2
          })
        document
          .querySelectorAll('nav [aria-current=date]')
          .forEach(function (day) {
            var strip = day.closest('ul')
            if (strip)
              strip.scrollLeft =
                day.offsetLeft - strip.clientWidth / 2 + day.offsetWidth / 2
          })
      }
      settle()
      document.addEventListener('click', settle)
    </script>
