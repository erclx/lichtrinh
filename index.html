<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Runs before the first paint so the page never flashes the other theme. The key and its values match src/features/settings/appearance.ts, which this script cannot import, and the listener rereads the choice so Light or Dark survives a scheme flip.
      ;(function () {
        var scheme = window.matchMedia('(prefers-color-scheme: dark)')
        function stored() {
          try {
            var value = localStorage.getItem('lichtrinh.theme')
            return value === 'light' || value === 'dark' ? value : 'auto'
          } catch (e) {
            return 'auto'
          }
        }
        function apply() {
          var choice = stored()
          document.documentElement.dataset.theme =
            choice === 'auto' ? (scheme.matches ? 'dark' : 'light') : choice
        }
        apply()
        scheme.addEventListener('change', apply)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Lịch trình" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta
      name="theme-color"
      content="#f8f8fc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121220"
      media="(prefers-color-scheme: dark)"
    />
    <title>Lịch trình</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
