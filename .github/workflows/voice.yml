name: Voice

# A separate workflow because the web stack rewrites verify.yml on every sync.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  voice-checks:
    name: 🐍 Voice Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voice
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv
        # A full release tag, since setup-uv publishes no floating major tag past v7
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: voice/uv.lock

      # Syncs the default and dev groups only, so no speech model or GPU wheel installs.
      - name: Install Dependencies
        run: uv sync --locked

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test:run
