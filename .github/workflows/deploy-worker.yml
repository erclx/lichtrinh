name: Deploy Worker

# Named apart from the stack's deploy.yml, which a sync would overwrite.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      drill_rollback:
        description: Roll a passing staging deploy back, which ends red by design
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Names no environment, so a fork's pull request reads no secret.
  dry-run:
    name: 📦 Deploy Dry Run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dry-run-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate Staging
        run: bun scripts/deploy/run.ts staging --dry-run

      - name: Validate Production
        run: bun scripts/deploy/run.ts production --dry-run

  staging:
    name: 🚀 Deploy Staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    # Keeps every waiting run, where the default keeps only the newest.
    concurrency:
      group: deploy-staging
      queue: max
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The release check compares with the commit before the push.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Detect Release
        id: release
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- .release-please-manifest.json)
          if [ -n "$changed" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi

      - name: Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test:run

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRILL: ${{ inputs.drill_rollback && '--drill-rollback' || '' }}
        # Unquoted, so an empty value passes no argument.
        run: bun scripts/deploy/run.ts staging $DRILL

  production:
    name: 🚀 Deploy Production
    needs: staging
    if: needs.staging.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/deploy/run.ts production
