[project]
name = "voice"
version = "0.1.0"
description = "Speech recognition for the trip calendar, and the benchmark that picks its model"
requires-python = ">=3.14"
dependencies = [
  "av<19",
  "fastapi>=0.165.0",
  "numpy>=2.5.5",
  "pydantic>=2.14.4",
  "python-multipart>=0.0.34",
  "uvicorn>=0.54.0",
]

[project.scripts]
voice = "voice:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.6",
]
# The speech models, installed only on the workspace PC, never in CI.
gpu = [
  "ctranslate2>=4.9.1",
  "faster-whisper==1.2.1",
  "nvidia-cublas-cu12>=12.9.3.13",
  "nvidia-cudnn-cu12>=9.28.1.4",
  "qwen-asr==0.0.6",
  "torch==2.15.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", group = "gpu" }]
