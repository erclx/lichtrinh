[mypy]
python_version = 3.14
strict = True
ignore_missing_imports = True
exclude = (?x)(^tests/ | ^docs/)
mypy_path = src

# The gpu group installs these on the workspace PC alone, so CI never sees
# them. Skipping them keeps a local check reading what CI reads.
[mypy-torch.*,qwen_asr.*,faster_whisper.*,ctranslate2.*,huggingface_hub.*]
follow_imports = skip
ignore_missing_imports = True
